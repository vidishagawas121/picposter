# ==============================================================================
# PicPoster Production Nginx Reverse Proxy Configuration
# Domain:    picposter.fouriseindia.com
# Location:  /etc/nginx/sites-available/picposter.conf
# Symlink:   sudo ln -s /etc/nginx/sites-available/picposter.conf /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
# SSL Cert:  sudo certbot --nginx -d picposter.fouriseindia.com
# ==============================================================================

# Rate Limiting Zones (DDoS / Brute-force protection)
limit_req_zone $binary_remote_addr zone=picposter_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=picposter_auth_limit:10m rate=5r/s;

# Upstream Backend Node/PM2 Cluster
upstream picposter_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name picposter.fouriseindia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picposter.fouriseindia.com;

    # SSL Certificate Paths (Managed automatically by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/picposter.fouriseindia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/picposter.fouriseindia.com/privkey.pem;

    # SSL Security Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client Request & Body Limits (Allows poster & banner uploads up to 25MB)
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # 1. Frontend Static Files (Vite SPA Production Build)
    root /var/www/picposter/frontend/dist;
    index index.html;

    # Cache hashed Vite assets for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Don't cache index.html so users receive instant app updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires off;
    }

    # 2. Uploaded Media Files Direct Serving (High performance bypass)
    location /uploads/ {
        alias /var/www/picposter/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        autoindex off;
    }

    # 3. Backend API Reverse Proxy
    location /api/ {
        limit_req zone=picposter_api_limit burst=20 nodelay;

        proxy_pass http://picposter_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Strict Rate Limiting on Auth/OTP Route
    location /api/v1/auth/ {
        limit_req zone=picposter_auth_limit burst=5 nodelay;

        proxy_pass http://picposter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Health Check Endpoint
    location /health {
        proxy_pass http://picposter_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 6. SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
